  # Pinned to TypeScript 6, per the vite-plus maintainers' guidance
  # (voidzero-dev/vite-plus#2148): `vp pack`'s `.d.ts` emit drives the classic
  # programmatic API that TS 7.0 dropped until 7.1, and upstream rolldown/tsdown
  # aren't TS-7-compatible yet. `vp check` still type-checks via tsgolint (the
  # Go/tsgo toolchain), so this doesn't cost us native-speed type checking.
  # Revisit TS 7 once vite-plus supports it.
  typescript: ^6.0.3
